[package]
name = "neurospace-test-utils"
version = "0.1.0"
edition = "2021"
description = "Test utilities for the NeuroSpacetime system"
authors = ["NeuroSpark Team"]
license = "MIT"

[dependencies]
# SpacetimeDB SDK
spacetimedb-sdk = "1.1.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Testing
mockall = "0.11"

# Utilities
chrono = "0.4"
uuid = { version = "1.3", features = ["v4"] }

[lib]
name = "neurospace_test_utils"
path = "src/lib.rs"
