[package]
name = "neurospace-reducers"
version = "0.1.0"
edition = "2021"
description = "SpacetimeDB reducers for the NeuroSpacetime system"
authors = ["NeuroSpark Team"]
license = "MIT"

[dependencies]
# SpacetimeDB
spacetimedb = "0.8.2"
spacetimedb-sdk = "1.1.1"

# Logging
log = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.28", features = ["full"] }

# Logging
tracing = "0.1"

# Utilities
chrono = "0.4"
uuid = { version = "1.3", features = ["v4"] }
rand = "0.8"

[dev-dependencies]
# Testing
mockall = "0.11"
proptest = "1.2"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
# Optimize for size and performance
opt-level = 3
lto = true
codegen-units = 1
